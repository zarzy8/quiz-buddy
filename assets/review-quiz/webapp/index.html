<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 刷题</title>
<style>
  :root{--accent:#4a7dff;--ok:#1ea672;--bad:#e5484d;--line:#e6e8eb;--muted:#8a9099;--ink:#1c1f23}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       background:#f4f5f7;color:var(--ink);display:flex;justify-content:center;padding:28px 16px 48px}
  .app{width:min(620px,100%)}
  .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted);margin-bottom:10px}
  .bar{height:6px;border-radius:99px;background:#e7e9ee;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;
        box-shadow:0 10px 28px rgba(23,28,45,.06)}
  .no{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.02em}
  .stem{font-size:17px;line-height:1.65;font-weight:600;margin:0 0 18px}
  .opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;
       padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s,transform .1s}
  .opt:hover{border-color:#b9c6ff;background:#f7f9ff}
  .opt:active{transform:scale(.995)}
  .opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid #cfd4dc;display:flex;align-items:center;
          justify-content:center;font-size:13px;color:#6b7280;background:#fff}
  .opt .t{font-size:14px;line-height:1.6;padding-top:2px}
  .opt.sel{border-color:var(--accent);background:#f4f7ff}
  .opt.sel .k{border-color:var(--accent);background:var(--accent);color:#fff}
  .opt.ok{border-color:var(--ok);background:#f2fbf7}
  .opt.ok .k{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fef5f5}
  .opt.bad .k{border-color:var(--bad);background:var(--bad);color:#fff}
  .opt.dis{cursor:default}
  .fb{display:none;margin-top:14px;font-size:14px;line-height:1.7}
  .fb.show{display:block}
  .fb b.ok{color:var(--ok)}.fb b.bad{color:var(--bad)}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);
         padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{border-color:#c3cad6}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri:hover{background:#3d6ef0;border-color:#3d6ef0}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hero{font-size:20px;font-weight:700;margin:0 0 6px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 18px}
  .pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .pick button.on{border-color:var(--accent);color:var(--accent);background:#f4f7ff}
  .stat{display:flex;gap:28px;margin:18px 0 6px}
  .stat div{font-size:13px;color:var(--muted)}
  .stat b{display:block;font-size:24px;color:var(--ink);margin-top:4px}
  .wrong{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .wq{font-size:14px;line-height:1.65;padding:10px 0;border-bottom:1px dashed var(--line)}
  .wq .m{font-size:12px;color:var(--muted);margin-top:4px}
  .wq .m b{color:var(--bad)}
  .empty{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><span id="hdLeft">AI 刷题</span><span id="hdRight"></span></div>
  <div class="bar"><i id="progress"></i></div>
  <main id="view"></main>
</div>
<script>
(function () {
  var bank = [], queue = [], idx = 0, answered = 0, correct = 0, wrongs = [], locked = false;
  var picked = new Set(), cur = null;
  var view = document.getElementById('view');
  var hdLeft = document.getElementById('hdLeft');
  var hdRight = document.getElementById('hdRight');
  var progress = document.getElementById('progress');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function key(q, label) {
    if (q.type === '判断题') return label === '正确' ? '对' : '错';
    return label;
  }
  function countOf(type) { return bank.filter(function (q) { return q.type === type; }).length; }

  function boot() {
    fetch('/api/questions').then(function (r) { return r.json(); }).then(function (list) {
      bank = list;
      var m = new URLSearchParams(location.search).get('start');
      if (m === 'all') start(null);
      else if (m && ['单选题', '多选题', '判断题'].indexOf(m) >= 0) start(m);
      else renderStart();
    }).catch(function () { view.innerHTML = '<div class="card">加载题库失败，请确认本地服务还在运行。</div>'; });
  }

  function renderStart() {
    hdLeft.textContent = '四级人工智能 · 题库';
    hdRight.textContent = '';
    progress.style.width = '0%';
    view.innerHTML =
      '<div class="card">' +
        '<p class="hero">开始刷题</p>' +
        '<p class="sub">共 ' + bank.length + ' 道客观题，选一种题型开始。点选项即判分。</p>' +
        '<div class="pick" id="pick"></div>' +
        '<div class="stat">' +
          '<div>单选题<b>' + countOf('单选题') + '</b></div>' +
          '<div>多选题<b>' + countOf('多选题') + '</b></div>' +
          '<div>判断题<b>' + countOf('判断题') + '</b></div>' +
        '</div>' +
        '<div class="actions"><button class="pri" id="goAll">全部乱序开始</button></div>' +
      '</div>';
    var pick = document.getElementById('pick');
    [['单选题', '只刷单选'], ['多选题', '只刷多选'], ['判断题', '只刷判断']].forEach(function (p) {
      var b = document.createElement('button');
      b.textContent = p[1];
      b.onclick = function () { start(p[0]); };
      pick.appendChild(b);
    });
    document.getElementById('goAll').onclick = function () { start(null); };
  }

  function start(type) {
    queue = bank.filter(function (q) { return !type || q.type === type; });
    if (!type) queue.sort(function () { return Math.random() - 0.5; });
    idx = 0; answered = 0; correct = 0; wrongs = [];
    render();
  }

  function render() {
    cur = queue[idx];
    locked = false; picked = new Set();
    hdLeft.textContent = '第 ' + (idx + 1) + ' / ' + queue.length + ' 题';
    hdRight.textContent = '已答 ' + answered + ' · 对 ' + correct + ' · 错 ' + (answered - correct);
    progress.style.width = (idx / queue.length * 100) + '%';

    var html = '<div class="card">' +
      '<div class="no">' + cur.no + '. [' + cur.type + ']</div>' +
      '<h2 class="stem">' + esc(cur.stem) + '</h2><div id="opts"></div>' +
      '<div class="fb" id="fb"></div>' +
      '<div class="actions" id="acts"></div></div>';
    view.innerHTML = html;

    var opts = document.getElementById('opts');
    cur.options.forEach(function (o) {
      var d = document.createElement('div');
      d.className = 'opt'; d.dataset.label = o.label;
      d.innerHTML = '<span class="k">' + esc(key(cur, o.label)) + '</span><span class="t">' + esc(o.text) + '</span>';
      d.onclick = function () { choose(o.label, d); };
      opts.appendChild(d);
    });
    renderActions();
  }

  function renderActions() {
    var acts = document.getElementById('acts');
    acts.innerHTML = '';
    if (cur.type === '多选题') {
      var sub = document.createElement('button');
      sub.className = 'pri'; sub.id = 'submit';
      sub.textContent = '提交答案'; sub.disabled = true;
      sub.onclick = function () { submit(Array.from(picked).sort().join('')); };
      acts.appendChild(sub);
    }
    var next = document.createElement('button');
    next.id = 'next'; next.textContent = idx === queue.length - 1 ? '查看结果' : '下一题';
    next.className = 'pri'; next.disabled = true;
    next.onclick = nextQuestion;
    acts.appendChild(next);
    window.__submitBtn = acts.querySelector('#submit');
  }

  function choose(label, el) {
    if (locked) return;
    if (cur.type === '多选题') {
      var on = picked.has(label);
      if (on) { picked.delete(label); el.classList.remove('sel'); }
      else { picked.add(label); el.classList.add('sel'); }
      if (window.__submitBtn) window.__submitBtn.disabled = picked.size === 0;
      return;
    }
    el.classList.add('sel');
    submit(label);
  }

  function submit(answer) {
    if (locked) return;
    locked = true;
    var opts = Array.prototype.slice.call(document.querySelectorAll('.opt'));
    opts.forEach(function (d) { d.classList.add('dis'); d.onclick = null; });
    fetch('/api/answer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: cur.id, answer: answer })
    }).then(function (r) { return r.json(); }).then(function (res) {
      answered++;
      if (res.correct) correct++;
      else wrongs.push({ q: cur, my: answer, right: res.answer });
      var right = res.answer;
      opts.forEach(function (d) {
        var l = d.dataset.label;
        var isRight = cur.type === '判断题' ? (l === right) : (right.indexOf(l) >= 0);
        if (isRight) d.classList.add('ok');
        else if (isRight === false && (picked.has(l) || answer === l)) d.classList.add('bad');
      });
      var fb = document.getElementById('fb');
      fb.innerHTML = res.correct
        ? '<b class="ok">回答正确</b>'
        : '<b class="bad">回答错误</b>　正确答案：' + esc(right);
      fb.classList.add('show');
      var next = document.getElementById('next');
      if (next) next.disabled = false;
      hdRight.textContent = '已答 ' + answered + ' · 对 ' + correct + ' · 错 ' + (answered - correct);
      progress.style.width = ((idx + 1) / queue.length * 100) + '%';
    }).catch(function () {
      locked = false;
      document.getElementById('fb').innerHTML = '<b class="bad">提交失败</b>，请确认本地服务在运行。';
      document.getElementById('fb').classList.add('show');
    });
  }

  function nextQuestion() {
    idx++;
    if (idx >= queue.length) { renderResult(); return; }
    render();
  }

  function renderResult() {
    hdLeft.textContent = '本轮结果';
    hdRight.textContent = '';
    progress.style.width = '100%';
    var rate = answered ? Math.round(correct / answered * 100) : 0;
    var list = wrongs.map(function (w) {
      return '<div class="wq">' + esc(w.q.stem) +
        '<div class="m">你的答案：<b>' + esc(w.my) + '</b>　正确答案：' + esc(w.right) +
        '　（' + esc(w.q.type) + ' 第 ' + w.q.no + ' 题）</div></div>';
    }).join('');
    view.innerHTML = '<div class="card">' +
      '<p class="hero">本轮测验结果</p>' +
      '<p class="sub">共答 ' + answered + ' 题，错 ' + wrongs.length + ' 题</p>' +
      '<div class="stat">' +
        '<div>总题数<b>' + answered + '</b></div>' +
        '<div>错题数<b>' + wrongs.length + '</b></div>' +
        '<div>准确率<b>' + rate + '%</b></div>' +
      '</div>' +
      '<div class="wrong">' + (wrongs.length ? '<div class="no">错题清单</div>' + list : '<p class="empty">全对，没有错题。</p>') + '</div>' +
      '<div class="actions"><button class="pri" id="again">再来一轮</button></div>' +
    '</div>';
    document.getElementById('again').onclick = function () { renderStart(); };
  }

  boot();
})();
</script>
</body>
</html>
